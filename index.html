
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Master - Typing Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>⌨️ Typing Master</h1>
        <p>Improve your typing speed and accuracy</p>
    </header>

    <main class="container">

        <h2>Choose Your Typing Topic</h2>

        <select id="topicSelect"></select>

        <div class="topic-navigation">
            <button id="prevBtn">← Previous</button>
            <span id="topicNumber">Topic 1 of 20</span>
            <button id="nextBtn">Next →</button>
        </div>

        <div class="stats">
            <div class="stat">
                <h3 id="timer">60</h3>
                <p>Seconds</p>
            </div>

            <div class="stat">
                <h3 id="wpm">0</h3>
                <p>WPM</p>
            </div>

            <div class="stat">
                <h3 id="accuracy">100%</h3>
                <p>Accuracy</p>
            </div>

            <div class="stat">
                <h3 id="mistakes">0</h3>
                <p>Mistakes</p>
            </div>
        </div>

        <h3 class="passage-heading">Type the following paragraph:</h3>

        <div id="textDisplay" class="text-display"></div>

        <textarea
            id="typingInput"
            placeholder="Click Start Test and type here..."
            disabled
        ></textarea>

        <div class="actions">
            <button id="startBtn">Start Test</button>
            <button id="restartBtn" class="restart">Restart</button>
        </div>

        <div id="result"></div>

    </main>

    <footer>
        <p>Typing Master © 2026 | Practice Makes Perfect</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
